
Tracker PixelsSubDisk {

  etaCut 10
  zError 70

  smallDelta 0
  bigDelta 3

  servicesForcedUp false

  rotateBarrelByHalfPi true
  
  @include-std CMS_Phase2/Pixel/moduleOperatingParms

  // Big pixels at the inter-ROC boundaries (only applied along directions with more than one ROC)
  numBigPixelsPerROCX 2
  numBigPixelsPerROCY 1
  bigPixelPitchX 0.0875
  bigPixelPitchY 0.225

  barrelDetIdScheme Phase2Subdetector1
  endcapDetIdScheme Phase2Subdetector4WithSD

  @include BPIX_7_5_0.cfg
  @include TFPX_7_5_0.cfg
  @include TEPX_7_5_0.cfg


  @include-std CMS_Phase2/Pixel/Materials/MechanicalSupports/IT_Support_Tube.cfg
  @include-std CMS_Phase2/Pixel/Materials/MechanicalSupports/IT_Service_Cylinder.cfg

}
