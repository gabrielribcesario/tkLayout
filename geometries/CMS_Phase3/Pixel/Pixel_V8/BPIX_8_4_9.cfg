Barrel TBPX { // 8_4_9: L1 from recent_tpbx_material, L2-L4 as BPIX_7_5_0
    trackingTags pixel,tracker

    @include-std CMS_Phase2/Pixel/Materials/MechanicalSupports/TBPX_Supports.cfg
    @include-std CMS_Phase2/Pixel/Conversions/On_flange/flange_BPIX
    @include-std CMS_Phase2/Pixel/Conversions/On_services_cylinder/stations_serving_TBPX_614

    beamSpotCover false
    smallDelta 0
    numLayers 4
    startZMode modulecenter
    numModules 5  // 4 on the right and 4 on the left and a central one
    compressed false
    innerRadius 30
    outerRadius 146.5

    smallParity 1
    bigParity 1

    Layer 1 {
      moduleSubType 1
      skewAngle 0.35
      bigDelta 0
      zOverlap -0.75 // 0.75 mm space between active areas: 0.175 mm dead area on each sensor side + 0.4 mm gap
      zGap 0.7
      zCentral -21.125
      @include-std CMS_Phase2/Pixel/ModuleTypes/pixel_1x2_25x100_wide_2sens_3D_v202602
      @include-std CMS_Phase3/Pixel/Materials/module_BPIX_L1_1x2_2500_3D_v202611
      @include-std CMS_Phase2/Pixel/Materials/rod_BPIX_L1
      @include-std CMS_Phase2/Pixel/Resolutions/25x100
      destination BPIX1
      numRods 12
    }
    Layer 2 {
      moduleSubType 2
      isSkewedForInstallation true
      skewedModuleEdgeShift 5
      installationOverlapRatio 2
      bigDelta 2.5
      zOverlap -1.3 // 1.3 mm space between active areas: 0.45 mm dead area on each sensor side + 0.4 mm gap
      zGap 0.7
      zCentral -22.425
      @include-std CMS_Phase2/Pixel/ModuleTypes/pixel_1x2_25x100_v202305
      @include-std CMS_Phase2/Pixel/Materials/module_BPIX_L2_1x2_2500_v202602
      @include-std CMS_Phase2/Pixel/Materials/rod_BPIX_L2
      @include-std CMS_Phase2/Pixel/Resolutions/25x100
      destination BPIX2
      radiusMode fixed
      placeRadiusHint 61.5
      numRods 24
    }
    Layer 3 {
      moduleSubType 3
      isSkewedForInstallation true
      skewedModuleEdgeShift 5
      installationOverlapRatio 2
      bigDelta 2.5
      zOverlap -1.3 // 1.3 mm space between active areas: 0.435 mm dead area on each sensor side + 0.43 mm gap
      zGap 0.7
      zCentral -21.025
      @include-std CMS_Phase2/Pixel/ModuleTypes/pixel_2x2_25x100_v202610
      @include-std CMS_Phase2/Pixel/Materials/module_BPIX_L3_2x2_2500_v202602
      @include-std CMS_Phase2/Pixel/Materials/rod_BPIX_L3
      @include-std CMS_Phase2/Pixel/Resolutions/25x100
      destination BPIX3
      radiusMode fixed
      placeRadiusHint 104.5
      numRods 20
    }
    Layer 4 {
      moduleSubType 4
      isSkewedForInstallation true
      skewedModuleEdgeShift 5
      installationOverlapRatio 2
      bigDelta 2.5
      zOverlap -1.3 // 1.3 mm space between active areas: 0.435 mm dead area on each sensor side + 0.43 mm gap
      zGap 0.7
      zCentral -22.425
      @include-std CMS_Phase2/Pixel/ModuleTypes/pixel_2x2_25x100_v202610
      @include-std CMS_Phase2/Pixel/Materials/module_BPIX_L4_2x2_2500_v202602
      @include-std CMS_Phase2/Pixel/Materials/rod_BPIX_L4
      @include-std CMS_Phase2/Pixel/Resolutions/25x100
      destination BPIX4
      numRods 28
    }
  }
